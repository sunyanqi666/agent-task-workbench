name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本取自 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 三道门禁与本地验收完全一致；测试默认 demo 模式，无需任何密钥
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # 失败时把 TAP 输出中的 "not ok" 行转成 error 注解：失败测试名直接出现在 PR / check 视图与 API 中
      - name: Test
        run: |
          set -o pipefail
          if ! pnpm test 2>&1 | tee /tmp/test-output.log; then
            grep '^not ok' /tmp/test-output.log | sed 's/^/::error::/' || true
            exit 1
          fi
